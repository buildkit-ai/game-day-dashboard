[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "game-day-dashboard"
version = "0.1.0"
description = "Full-screen live sports scoreboard tracking NBA, MLB, and Soccer games"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["requests>=2.28", "rich>=13.0", "flask>=3.0"]
keywords = ["sports", "dashboard", "scoreboard", "nba", "mlb", "soccer", "live-scores"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/buildkit-ai/game-day-dashboard"
Repository = "https://github.com/buildkit-ai/game-day-dashboard"

[tool.hatch.build.targets.wheel]
packages = ["game_day_dashboard"]
